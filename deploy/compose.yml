name: atlas

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${ATLAS_DB_PASSWORD:?ATLAS_DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --data-checksums
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - atlas_postgres:/var/lib/postgresql/data
    networks: [data]
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s

  app:
    image: ${ATLAS_IMAGE:-ghcr.io/prabhavalabs/atlas:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ATLAS_ENVIRONMENT: production
      ATLAS_HTTP_ADDRESS: 0.0.0.0:8080
      ATLAS_WEB_ROOT: /app/web
      ATLAS_DATABASE_URL: ${ATLAS_DATABASE_URL:?ATLAS_DATABASE_URL is required}
      ATLAS_PUBLIC_URL: ${ATLAS_PUBLIC_URL:-https://atlas.prabhavalabs.com}
      ATLAS_API_URL: ${ATLAS_API_URL:-https://api.atlas.prabhavalabs.com}
      ATLAS_CORS_ORIGINS: ${ATLAS_CORS_ORIGINS:-https://atlas.prabhavalabs.com}
      ATLAS_COOKIE_SECURE: "true"
      ATLAS_COOKIE_SAME_SITE: Lax
      ATLAS_CSRF_COOKIE_DOMAIN: ${ATLAS_CSRF_COOKIE_DOMAIN:-atlas.prabhavalabs.com}
      ATLAS_SESSION_TTL: 12h
      ATLAS_LOG_LEVEL: info
      ATLAS_METRICS_TOKEN: ${ATLAS_METRICS_TOKEN:?ATLAS_METRICS_TOKEN is required}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/atlas", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    networks: [data, edge]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks: [edge]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  atlas_postgres:
    name: atlas_postgres

networks:
  data:
    name: atlas_data
    internal: true
  edge:
    name: atlas_edge

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token
