# Production Atlas origin. The certificate covers both Atlas hostnames and is
# issued with the webroot command documented in docs/10-deployment-and-operations.md.

upstream atlas_app {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name atlas.prabhavalabs.com atlas-api.prabhavalabs.com;

    include /etc/nginx/snippets/atlas-cloudflare-origin-allow.conf;

    location ^~ /.well-known/acme-challenge/ {
        # Let’s Encrypt validators do not originate from Cloudflare. Defining
        # access rules here overrides the server-level Cloudflare allowlist.
        allow all;
        root /var/www/atlas-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atlas.prabhavalabs.com atlas-api.prabhavalabs.com;

    include /etc/nginx/snippets/atlas-cloudflare-origin-allow.conf;

    ssl_certificate /etc/letsencrypt/live/atlas.prabhavalabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas.prabhavalabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AtlasTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        # Keep renewals independent from Cloudflare proxy state.
        allow all;
        root /var/www/atlas-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://atlas_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
