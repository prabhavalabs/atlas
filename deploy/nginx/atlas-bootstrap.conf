# Temporary HTTP origin used before the origin certificate is issued.
# Replace this file with atlas.conf after the certificate exists.

upstream atlas_app {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name atlas.prabhavalabs.com atlas-api.prabhavalabs.com;

    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/atlas-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://atlas_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
