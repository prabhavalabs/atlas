name: Bug report
description: Report reproducible incorrect behavior in Atlas.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private information, or unredacted sensitive disaster data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence, fixture, or request that demonstrates the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Release tag or commit SHA
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Public-safety or data impact
      description: Could this expose, hide, duplicate, misclassify, or misstate a disaster event?
    validations:
      required: true
