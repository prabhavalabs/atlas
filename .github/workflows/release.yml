name: Release and deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: atlas-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/prabhavalabs/atlas
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Publish immutable image
    runs-on: ubuntu-latest
    outputs:
      deploy_image: ${{ steps.image.outputs.deploy_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Select immutable tag
        shell: bash
        run: echo "deploy_image=${IMAGE}:sha-${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.deploy_image }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            VITE_API_BASE_URL=https://atlas-api.prabhavalabs.com
            ATLAS_VERSION=sha-${{ env.SOURCE_SHA }}
            ATLAS_COMMIT=${{ env.SOURCE_SHA }}
            ATLAS_BUILD_TIME=${{ github.event.workflow_run.updated_at || 'workflow-dispatch' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Atlas VPS
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Configure deployment SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ATLAS_VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ATLAS_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/atlas_deploy
          chmod 0600 ~/.ssh/atlas_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Upload Compose definition
        env:
          VPS_HOST: ${{ secrets.ATLAS_VPS_HOST }}
          VPS_USER: ${{ secrets.ATLAS_VPS_USER }}
        run: |
          ssh -i ~/.ssh/atlas_deploy "${VPS_USER}@${VPS_HOST}" 'install -d -m 0750 /opt/atlas /opt/atlas/secrets'
          scp -i ~/.ssh/atlas_deploy deploy/compose.yml "${VPS_USER}@${VPS_HOST}:/opt/atlas/compose.yml"
      - name: Pull, migrate, and health-check
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ needs.publish.outputs.deploy_image }}
          VPS_HOST: ${{ secrets.ATLAS_VPS_HOST }}
          VPS_USER: ${{ secrets.ATLAS_VPS_USER }}
        run: |
          ssh -i ~/.ssh/atlas_deploy "${VPS_USER}@${VPS_HOST}" "DEPLOY_IMAGE='${DEPLOY_IMAGE}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/atlas
          test -f .env
          test -s secrets/cloudflare_tunnel_token
          previous_image="$(docker inspect atlas-app-1 --format '{{.Config.Image}}' 2>/dev/null || true)"
          export ATLAS_IMAGE="$DEPLOY_IMAGE"
          docker compose --env-file .env -f compose.yml config --quiet
          docker compose --env-file .env -f compose.yml pull
          if ! docker compose --env-file .env -f compose.yml up -d --remove-orphans --wait --wait-timeout 180; then
            if [ -n "$previous_image" ]; then
              export ATLAS_IMAGE="$previous_image"
              docker compose --env-file .env -f compose.yml up -d app cloudflared --wait --wait-timeout 120
            fi
            exit 1
          fi
          docker compose --env-file .env -f compose.yml ps
          REMOTE
