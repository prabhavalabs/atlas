name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go and PostGIS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: atlas_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ATLAS_TEST_DATABASE_URL: postgres://atlas:atlas-ci-only@127.0.0.1:5432/atlas_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Generated SQL is current
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/platform/store
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Database integration tests
        run: go test -p 1 -tags=integration ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  frontend:
    name: React and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Generated API client is current
        working-directory: web
        run: pnpm generate:check
      - name: Test
        working-directory: web
        run: pnpm test
      - name: Lint and type-check
        working-directory: web
        run: pnpm lint && pnpm typecheck
      - name: Production build
        working-directory: web
        env:
          VITE_API_BASE_URL: https://atlas-api.prabhavalabs.com
        run: pnpm build

  container:
    name: Production container
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: atlas:ci
          build-args: |
            VITE_API_BASE_URL=https://atlas-api.prabhavalabs.com
            ATLAS_VERSION=ci
            ATLAS_COMMIT=${{ github.sha }}
            ATLAS_BUILD_TIME=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
